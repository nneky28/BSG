<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#243128"/>
      <stop offset="100%" stop-color="#141d19"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1ecdd"/>
      <stop offset="50%" stop-color="#c9a35d"/>
      <stop offset="100%" stop-color="#916f30"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#33413a" stroke-width="6"/>

  <!-- Book / Ledger Graphic -->
  <g transform="translate(106, 120)" filter="url(#glow)">
    <!-- Book Left Page -->
    <path d="M 150 250 C 100 230 40 230 0 250 L 0 40 C 40 20 100 20 150 40 Z" fill="#1c2620" stroke="#c9a35d" stroke-width="8"/>
    <!-- Book Right Page -->
    <path d="M 150 250 C 200 230 260 230 300 250 L 300 40 C 260 20 200 20 150 40 Z" fill="#243128" stroke="#c9a35d" stroke-width="8"/>
    <!-- Center Spine -->
    <line x1="150" y1="35" x2="150" y2="255" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <!-- Cross on Right Page -->
    <line x1="225" y1="85" x2="225" y2="175" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <line x1="195" y1="115" x2="255" y2="115" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <!-- Bookmark Ribbon hanging down -->
    <path d="M 150 40 L 150 285 L 165 270 L 180 285 L 180 40 Z" fill="url(#goldGrad)"/>
  </g>
</svg>
