<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141d19;
    --surface:#1c2620;
    --surface-2:#243128;
    --surface-3:#2b392f;
    --line:#33413a;
    --gold:#c9a35d;
    --gold-soft:rgba(201,163,93,.14);
    --sage:#84a08d;
    --text:#f1ecdd;
    --muted:#93a599;
    --muted-2:#6d7d73;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:28px; --sp-7:40px;
    --r-sm:6px; --r-md:10px; --r-lg:16px;
  }
  *{box-sizing:border-box;}
  html{-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 500px at 20% -10%, rgba(201,163,93,.06), transparent 60%),
      var(--ink);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:clamp(16px,4vw,32px) clamp(14px,4vw,20px) 80px;}
  a{color:inherit;}
  button{font-family:inherit;}

  /* ---- Hero ---- */
  .hero-card{
    background:linear-gradient(165deg, var(--surface-2), var(--surface));
    border:1px solid var(--line);
    border-radius:var(--r-lg);
    padding:clamp(18px,4vw,28px);
    margin-bottom:var(--sp-5);
    position:relative;
    overflow:hidden;
  }
  .hero-card::before{
    content:"";
    position:absolute;
    top:-40%; right:-15%;
    width:280px;height:280px;
    background:radial-gradient(circle, var(--gold-soft), transparent 70%);
    pointer-events:none;
  }
  .eyebrow{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--sage);
    margin:0 0 8px;
  }
  h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(24px,5.5vw,34px);
    margin:0 0 6px;
    line-height:1.08;
    letter-spacing:-0.01em;
  }
  .sub{
    color:var(--muted);
    font-size:13.5px;
    margin:0 0 20px;
    line-height:1.5;
  }
  .whoami{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--gold);
    cursor:pointer;
    text-decoration:underline;
    text-decoration-color:var(--gold-soft);
    text-underline-offset:2px;
  }

  /* ribbon progress bar (signature element) */
  .ribbon-wrap{margin:0 0 22px;position:relative;}
  .ribbon-label{
    display:flex;justify-content:space-between;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--muted);
    margin-bottom:7px;
  }
  .ribbon-label b{color:var(--gold);font-weight:500;}
  .ribbon-track{
    position:relative;
    height:10px;
    background:var(--surface-3);
    border-radius:5px;
    overflow:visible;
  }
  .ribbon-fill{
    height:100%;
    border-radius:5px;
    background:linear-gradient(90deg, var(--gold-soft), var(--gold));
    transition:width .6s cubic-bezier(.4,0,.2,1);
    position:relative;
  }
  .ribbon-tail{
    position:absolute;
    right:-1px; top:100%;
    width:14px; height:16px;
    background:var(--gold);
    clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%);
    transform:translateX(50%);
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));
  }

  .stat-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:var(--sp-3);
  }
  .stat{
    background:rgba(0,0,0,.15);
    border:1px solid var(--line);
    border-radius:var(--r-sm);
    padding:10px 8px;
    text-align:center;
  }
  .stat b{
    display:block;
    font-family:var(--font-display);
    font-size:clamp(17px,4vw,21px);
    font-weight:600;
    color:var(--gold);
    line-height:1.2;
  }
  .stat span{
    font-size:9.5px;
    color:var(--muted-2);
    text-transform:uppercase;
    letter-spacing:.06em;
  }
  @media (max-width:420px){
    .stat-grid{grid-template-columns:repeat(2,1fr);}
  }

  /* ---- Cards ---- */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--r-lg);
    padding:clamp(16px,3.5vw,22px);
    margin-bottom:var(--sp-4);
  }
  .card h2{
    font-family:var(--font-display);
    font-weight:600;
    font-size:16px;
    margin:0 0 14px;
    display:flex;
    align-items:baseline;
    gap:8px;
    flex-wrap:wrap;
  }
  .card h2 .n{
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--muted-2);
    font-weight:400;
    letter-spacing:.03em;
  }

  /* ---- Today card ---- */
  .today-row{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;}
  .today-ref{font-size:clamp(16px,3.5vw,19px);font-family:var(--font-display);font-weight:500;line-height:1.35;}
  .today-meta{font-family:var(--font-mono);font-size:11px;color:var(--muted-2);margin-top:5px;}
  .btn{
    font-family:var(--font-body);
    font-weight:600;
    font-size:13.5px;
    border:1px solid var(--gold);
    background:transparent;
    color:var(--gold);
    padding:11px 18px;
    border-radius:var(--r-sm);
    cursor:pointer;
    transition:background .15s, color .15s, transform .1s;
    white-space:nowrap;
    min-height:42px;
  }
  .btn:hover{background:var(--gold-soft);}
  .btn:active{transform:scale(.97);}
  .btn.done{background:var(--gold);color:var(--ink);}
  .avatars{display:flex;gap:5px;margin-top:12px;flex-wrap:wrap;}
  .av{
    width:26px;height:26px;border-radius:50%;
    background:var(--surface-3);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--sage);
    flex-shrink:0;
  }
  .av.me{border-color:var(--gold);color:var(--gold);}

  /* ---- Leaderboard ---- */
  .lb-row{
    display:flex;align-items:center;gap:10px;
    padding:9px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .lb-row:last-child{border-bottom:none;}
  .lb-name{width:96px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lb-bar-wrap{flex:1;height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden;min-width:36px;}
  .lb-bar{height:100%;background:var(--sage);border-radius:3px;}
  .lb-count{font-family:var(--font-mono);font-size:11px;color:var(--muted-2);width:52px;text-align:right;flex-shrink:0;}

  /* ---- Weeks / ledger ---- */
  .week{border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:8px;overflow:hidden;background:var(--surface);}
  .week-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:13px 16px;
    cursor:pointer;
    user-select:none;
    gap:10px;
  }
  .week-head:hover{background:var(--surface-2);}
  .week-left{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0;}
  .week-title{font-family:var(--font-display);font-size:14.5px;font-weight:600;}
  .week-range{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-2);}
  .week-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .week-progress{font-family:var(--font-mono);font-size:11px;color:var(--sage);}
  .chevron{
    width:16px;height:16px;
    color:var(--muted);
    transition:transform .2s;
    flex-shrink:0;
  }
  .week-body.open ~ .week-head .chevron,
  .week.open .chevron{transform:rotate(180deg);}
  .week-body{display:none;border-top:1px solid var(--line);}
  .week-body.open{display:block;}
  .day-row{
    display:flex;align-items:center;gap:10px;
    padding:10px 16px;
    border-bottom:1px solid var(--line);
  }
  .day-row:last-child{border-bottom:none;}
  .day-row.is-today{background:var(--gold-soft);}
  .day-num{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--muted-2);
    width:30px;
    flex-shrink:0;
  }
  .day-ref{flex:1;font-size:13.5px;min-width:0;line-height:1.4;}
  .day-avatars{display:flex;gap:3px;flex-shrink:0;}
  .day-avatars .av{width:18px;height:18px;font-size:7.5px;}
  .day-check{
    width:28px;height:28px;border-radius:7px;
    border:1px solid var(--line);
    background:var(--surface-3);
    cursor:pointer;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;
    color:var(--gold);
    transition:background .15s, border-color .15s, transform .1s;
  }
  .day-check:active{transform:scale(.92);}
  .day-check.on{background:var(--gold);border-color:var(--gold);color:var(--ink);}

  /* ---- Onboarding ---- */
  .onboard{max-width:400px;margin:14vh auto 0;text-align:center;padding:0 16px;}
  .onboard h1{font-size:clamp(22px,6vw,28px);}
  .onboard input{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:var(--r-sm);
    padding:12px 14px;
    color:var(--text);
    font-family:var(--font-body);
    font-size:15px;
    margin:10px 0;
  }
  .onboard input:focus{outline:none;border-color:var(--gold);}
  .onboard .btn{width:100%;margin-top:8px;padding:13px;}
  .loading{text-align:center;padding:80px 20px;color:var(--muted);font-family:var(--font-mono);font-size:13px;}

  @media (max-width:380px){
    .day-num{display:none;}
    .lb-name{width:72px;}
  }
</style>
</head>
<body>
<div id="root"><div class="loading">Opening the ledger…</div></div>

<script>
const SCHEDULE = [[1,"Genesis 1-7",7],[2,"Genesis 8-13",6],[3,"Genesis 14-20",7],[4,"Genesis 21-26",6],[5,"Genesis 27-33",7],[6,"Genesis 34-40",7],[7,"Genesis 41-46",6],[8,"Genesis 47-50; Exodus 1-3",7],[9,"Exodus 4-9",6],[10,"Exodus 10-16",7],[11,"Exodus 17-23",7],[12,"Exodus 24-29",6],[13,"Exodus 30-36",7],[14,"Exodus 37-40; Leviticus 1-2",6],[15,"Leviticus 3-9",7],[16,"Leviticus 10-16",7],[17,"Leviticus 17-22",6],[18,"Leviticus 23-27; Numbers 1-2",7],[19,"Numbers 3-9",7],[20,"Numbers 10-15",6],[21,"Numbers 16-22",7],[22,"Numbers 23-28",6],[23,"Numbers 29-35",7],[24,"Numbers 36; Deuteronomy 1-6",7],[25,"Deuteronomy 7-12",6],[26,"Deuteronomy 13-19",7],[27,"Deuteronomy 20-25",6],[28,"Deuteronomy 26-32",7],[29,"Deuteronomy 33-34; Joshua 1-5",7],[30,"Joshua 6-11",6],[31,"Joshua 12-18",7],[32,"Joshua 19-24",6],[33,"Judges 1-7",7],[34,"Judges 8-14",7],[35,"Judges 15-20",6],[36,"Judges 21; Ruth 1-4; 1 Samuel 1-2",7],[37,"1 Samuel 3-8",6],[38,"1 Samuel 9-15",7],[39,"1 Samuel 16-22",7],[40,"1 Samuel 23-28",6],[41,"1 Samuel 29-31; 2 Samuel 1-4",7],[42,"2 Samuel 5-10",6],[43,"2 Samuel 11-17",7],[44,"2 Samuel 18-24",7],[45,"1 Kings 1-6",6],[46,"1 Kings 7-13",7],[47,"1 Kings 14-19",6],[48,"1 Kings 20-22; 2 Kings 1-4",7],[49,"2 Kings 5-11",7],[50,"2 Kings 12-17",6],[51,"2 Kings 18-24",7],[52,"2 Kings 25; 1 Chronicles 1-5",6],[53,"1 Chronicles 6-12",7],[54,"1 Chronicles 13-19",7],[55,"1 Chronicles 20-25",6],[56,"1 Chronicles 26-29; 2 Chronicles 1-3",7],[57,"2 Chronicles 4-10",7],[58,"2 Chronicles 11-16",6],[59,"2 Chronicles 17-23",7],[60,"2 Chronicles 24-29",6],[61,"2 Chronicles 30-36",7],[62,"Ezra 1-7",7],[63,"Ezra 8-10; Nehemiah 1-3",6],[64,"Nehemiah 4-10",7],[65,"Nehemiah 11-13; Esther 1-3",6],[66,"Esther 4-10",7],[67,"Job 1-7",7],[68,"Job 8-13",6],[69,"Job 14-20",7],[70,"Job 21-26",6],[71,"Job 27-33",7],[72,"Job 34-40",7],[73,"Job 41-42; Psalms 1-4",6],[74,"Psalms 5-11",7],[75,"Psalms 12-17",6],[76,"Psalms 18-24",7],[77,"Psalms 25-31",7],[78,"Psalms 32-37",6],[79,"Psalms 38-44",7],[80,"Psalms 45-50",6],[81,"Psalms 51-57",7],[82,"Psalms 58-64",7],[83,"Psalms 65-70",6],[84,"Psalms 71-77",7],[85,"Psalms 78-83",6],[86,"Psalms 84-90",7],[87,"Psalms 91-97",7],[88,"Psalms 98-103",6],[89,"Psalms 104-110",7],[90,"Psalms 111-116",6],[91,"Psalms 117-123",7],[92,"Psalms 124-130",7],[93,"Psalms 131-136",6],[94,"Psalms 137-143",7],[95,"Psalms 144-150",7],[96,"Proverbs 1-6",6],[97,"Proverbs 7-13",7],[98,"Proverbs 14-19",6],[99,"Proverbs 20-26",7],[100,"Proverbs 27-31; Ecclesiastes 1-2",7],[101,"Ecclesiastes 3-8",6],[102,"Ecclesiastes 9-12; Song of Solomon 1-3",7],[103,"Song of Solomon 4-8; Isaiah 1",6],[104,"Isaiah 2-8",7],[105,"Isaiah 9-15",7],[106,"Isaiah 16-21",6],[107,"Isaiah 22-28",7],[108,"Isaiah 29-34",6],[109,"Isaiah 35-41",7],[110,"Isaiah 42-48",7],[111,"Isaiah 49-54",6],[112,"Isaiah 55-61",7],[113,"Isaiah 62-66; Jeremiah 1",6],[114,"Jeremiah 2-8",7],[115,"Jeremiah 9-15",7],[116,"Jeremiah 16-21",6],[117,"Jeremiah 22-28",7],[118,"Jeremiah 29-34",6],[119,"Jeremiah 35-41",7],[120,"Jeremiah 42-48",7],[121,"Jeremiah 49-52; Lamentations 1-2",6],[122,"Lamentations 3-5; Ezekiel 1-4",7],[123,"Ezekiel 5-10",6],[124,"Ezekiel 11-17",7],[125,"Ezekiel 18-24",7],[126,"Ezekiel 25-30",6],[127,"Ezekiel 31-37",7],[128,"Ezekiel 38-44",7],[129,"Ezekiel 45-48; Daniel 1-2",6],[130,"Daniel 3-9",7],[131,"Daniel 10-12; Hosea 1-3",6],[132,"Hosea 4-10",7],[133,"Hosea 11-14; Joel 1-3",7],[134,"Amos 1-6",6],[135,"Amos 7-9; Obadiah 1; Jonah 1-3",7],[136,"Jonah 4; Micah 1-5",6],[137,"Micah 6-7; Nahum 1-3; Habakkuk 1-2",7],[138,"Habakkuk 3; Zephaniah 1-3; Haggai 1-2; Zechariah 1",7],[139,"Zechariah 2-7",6],[140,"Zechariah 8-14",7],[141,"Malachi 1-4; Matthew 1-2",6],[142,"Matthew 3-9",7],[143,"Matthew 10-16",7],[144,"Matthew 17-22",6],[145,"Matthew 23-28; Mark 1",7],[146,"Mark 2-7",6],[147,"Mark 8-14",7],[148,"Mark 15-16; Luke 1-5",7],[149,"Luke 6-11",6],[150,"Luke 12-18",7],[151,"Luke 19-24",6],[152,"John 1-7",7],[153,"John 8-14",7],[154,"John 15-20",6],[155,"John 21; Acts 1-6",7],[156,"Acts 7-12",6],[157,"Acts 13-19",7],[158,"Acts 20-26",7],[159,"Acts 27-28; Romans 1-4",6],[160,"Romans 5-11",7],[161,"Romans 12-16; 1 Corinthians 1",6],[162,"1 Corinthians 2-8",7],[163,"1 Corinthians 9-15",7],[164,"1 Corinthians 16; 2 Corinthians 1-5",6],[165,"2 Corinthians 6-12",7],[166,"2 Corinthians 13; Galatians 1-6",7],[167,"Ephesians 1-6",6],[168,"Philippians 1-4; Colossians 1-3",7],[169,"Colossians 4; 1 Thessalonians 1-5",6],[170,"2 Thessalonians 1-3; 1 Timothy 1-4",7],[171,"1 Timothy 5-6; 2 Timothy 1-4; Titus 1",7],[172,"Titus 2-3; Philemon 1; Hebrews 1-3",6],[173,"Hebrews 4-10",7],[174,"Hebrews 11-13; James 1-3",6],[175,"James 4-5; 1 Peter 1-5",7],[176,"2 Peter 1-3; 1 John 1-4",7],[177,"1 John 5; 2 John 1; 3 John 1; Jude 1; Revelation 1-2",6],[178,"Revelation 3-9",7],[179,"Revelation 10-15",6],[180,"Revelation 16-22",7]];

const root = document.getElementById('root');
let state = { me: null, meta: null, progress: null };

function initials(name){
  return name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
}
function fmtDate(d){
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
function todayIndex(startDateStr){
  const start = new Date(startDateStr+'T00:00:00');
  const now = new Date();
  now.setHours(0,0,0,0);
  const diff = Math.floor((now-start)/86400000)+1;
  return Math.min(180, Math.max(1, diff));
}

async function load(){
  try{
    const idRes = await safeGet('my-identity', false);
    state.me = idRes ? JSON.parse(idRes.value).name : null;
  }catch(e){ state.me = null; }

  try{
    const metaRes = await safeGet('meta', true);
    state.meta = metaRes ? JSON.parse(metaRes.value) : null;
  }catch(e){ state.meta = null; }

  try{
    const progRes = await safeGet('progress', true);
    state.progress = progRes ? JSON.parse(progRes.value) : {};
  }catch(e){ state.progress = {}; }

  render();
}

async function safeGet(key, shared){
  try{
    return await window.storage.get(key, shared);
  }catch(e){
    return null;
  }
}

async function saveMeta(meta){
  state.meta = meta;
  await window.storage.set('meta', JSON.stringify(meta), true);
}
async function saveProgress(progress){
  state.progress = progress;
  await window.storage.set('progress', JSON.stringify(progress), true);
}
async function saveIdentity(name){
  state.me = name;
  await window.storage.set('my-identity', JSON.stringify({name}), false);
}

function render(){
  if(!state.meta){ renderStartSetup(); return; }
  if(!state.me){ renderJoin(); return; }
  renderLedger();
}

function renderStartSetup(){
  root.innerHTML = `
    <div class="onboard">
      <p class="eyebrow">New challenge</p>
      <h1>Start the reading ledger</h1>
      <p class="sub">1,189 chapters across 180 days (~6-7 chapters/day). Set your name and a start date — your friends will join the same ledger.</p>
      <input id="nameInput" type="text" placeholder="Your name" />
      <input id="dateInput" type="date" />
      <button class="btn" id="startBtn">Begin</button>
    </div>
  `;
  const dateInput = document.getElementById('dateInput');
  dateInput.value = new Date().toISOString().slice(0,10);
  document.getElementById('startBtn').onclick = async () => {
    const name = document.getElementById('nameInput').value.trim();
    const date = dateInput.value;
    if(!name || !date) return;
    await saveIdentity(name);
    await saveMeta({ startDate: date, members: [name] });
    await saveProgress({});
    render();
  };
}

function renderJoin(){
  const m = state.meta;
  root.innerHTML = `
    <div class="onboard">
      <p class="eyebrow">Joining a ledger already in progress</p>
      <h1>What's your name?</h1>
      <p class="sub">Started ${fmtDate(new Date(m.startDate+'T00:00:00'))} · ${m.members.length} reader${m.members.length!==1?'s':''} so far</p>
      <input id="nameInput" type="text" placeholder="Your name" />
      <button class="btn" id="joinBtn">Join</button>
    </div>
  `;
  document.getElementById('joinBtn').onclick = async () => {
    const name = document.getElementById('nameInput').value.trim();
    if(!name) return;
    await saveIdentity(name);
    if(!state.meta.members.includes(name)){
      await saveMeta({...state.meta, members:[...state.meta.members, name]});
    }
    render();
  };
}

function computeStreak(name, progress){
  let streak = 0;
  for(let d=180; d>=1; d--){
    const readers = progress[d] || [];
    if(readers.includes(name)) streak++;
    else break;
  }
  return streak;
}
function completedCount(name, progress){
  return Object.values(progress).filter(list => (list||[]).includes(name)).length;
}

function renderLedger(){
  const { me, meta, progress } = state;
  const members = meta.members;
  const myDone = completedCount(me, progress);
  const pct = Math.round((myDone/180)*100);
  const expectedDay = todayIndex(meta.startDate);
  const todayEntry = SCHEDULE[expectedDay-1];
  const iReadToday = (progress[expectedDay]||[]).includes(me);
  const todayReaders = progress[expectedDay]||[];
  const othersToday = todayReaders.filter(n=>n!==me);

  const board = members.map(n => ({name:n, count: completedCount(n, progress)}))
                        .sort((a,b)=>b.count-a.count);
  const maxCount = Math.max(1, ...board.map(b=>b.count));

  root.innerHTML = `
    <div class="wrap">
      <div class="hero-card">
        <p class="eyebrow">Six-month reading ledger</p>
        <h1>Through the Book, Together</h1>
        <p class="sub">Started ${fmtDate(new Date(meta.startDate+'T00:00:00'))} · 1,189 chapters · 180 days · <span class="whoami" id="whoamiBtn">${me}</span></p>

        <div class="ribbon-wrap">
          <div class="ribbon-label"><span>Day <b>${expectedDay}</b> of 180</span><span>${pct}% complete</span></div>
          <div class="ribbon-track">
            <div class="ribbon-fill" style="width:${pct}%"><div class="ribbon-tail"></div></div>
          </div>
        </div>

        <div class="stat-grid">
          <div class="stat"><b>${myDone}</b><span>Days read</span></div>
          <div class="stat"><b>${pct}%</b><span>Complete</span></div>
          <div class="stat"><b>${computeStreak(me,progress)}</b><span>Streak</span></div>
          <div class="stat"><b>${members.length}</b><span>Reader${members.length!==1?'s':''}</span></div>
        </div>
      </div>

      <div class="card">
        <h2>Today's reading <span class="n">Day ${expectedDay}</span></h2>
        <div class="today-row">
          <div>
            <div class="today-ref">${todayEntry[1]}</div>
            <div class="today-meta">${todayEntry[2]} chapters</div>
            ${othersToday.length ? `<div class="avatars">${othersToday.map(n=>`<div class="av" title="${n}">${initials(n)}</div>`).join('')}</div>` : ''}
          </div>
          <button class="btn ${iReadToday?'done':''}" id="todayBtn">${iReadToday? '✓ Read' : 'Mark as read'}</button>
        </div>
      </div>

      <div class="card">
        <h2>Leaderboard</h2>
        ${board.map(b=>`
          <div class="lb-row">
            <div class="lb-name">${b.name}${b.name===me?' (you)':''}</div>
            <div class="lb-bar-wrap"><div class="lb-bar" style="width:${(b.count/maxCount)*100}%"></div></div>
            <div class="lb-count">${b.count}/180</div>
          </div>
        `).join('')}
      </div>

      <div id="weeks"></div>
    </div>
  `;

  document.getElementById('whoamiBtn').onclick = async () => {
    const newName = prompt('Switch reader name on this device:', me);
    if(newName && newName.trim()){
      await saveIdentity(newName.trim());
      if(!state.meta.members.includes(newName.trim())){
        await saveMeta({...state.meta, members:[...state.meta.members, newName.trim()]});
      }
      render();
    }
  };

  document.getElementById('todayBtn').onclick = async () => {
    await toggleDay(expectedDay);
    render();
  };

  renderWeeks(expectedDay);
}

async function toggleDay(day){
  const progress = {...state.progress};
  const list = progress[day] ? [...progress[day]] : [];
  const i = list.indexOf(state.me);
  if(i>=0) list.splice(i,1); else list.push(state.me);
  progress[day] = list;
  await saveProgress(progress);
}

const CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function renderWeeks(expectedDay){
  const container = document.getElementById('weeks');
  const currentWeek = Math.ceil(expectedDay/7);
  let html = '';
  for(let w=0; w<26; w++){
    const startDay = w*7+1;
    const endDay = Math.min(180, startDay+6);
    const weekDays = SCHEDULE.slice(startDay-1, endDay);
    const weekNum = w+1;
    const doneCount = weekDays.filter(d => (state.progress[d[0]]||[]).includes(state.me)).length;
    const isOpen = weekNum===currentWeek;
    html += `
      <div class="week ${isOpen?'open':''}" data-week="${weekNum}">
        <div class="week-head" data-toggle="${weekNum}">
          <div class="week-left"><span class="week-title">Week ${weekNum}</span><span class="week-range">Days ${startDay}–${endDay}</span></div>
          <div class="week-right"><span class="week-progress">${doneCount}/${weekDays.length}</span>${CHEVRON}</div>
        </div>
        <div class="week-body ${isOpen?'open':''}" id="wb-${weekNum}">
          ${weekDays.map(d=>{
            const readers = state.progress[d[0]]||[];
            const on = readers.includes(state.me);
            const others = readers.filter(n=>n!==state.me);
            const isToday = d[0]===expectedDay;
            return `
              <div class="day-row ${isToday?'is-today':''}">
                <div class="day-num">D${d[0]}</div>
                <div class="day-ref">${d[1]}</div>
                <div class="day-avatars">${others.map(n=>`<div class="av" title="${n}">${initials(n)}</div>`).join('')}</div>
                <div class="day-check ${on?'on':''}" data-day="${d[0]}">${on?'✓':''}</div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }
  container.innerHTML = html;

  container.querySelectorAll('.week-head').forEach(el=>{
    el.addEventListener('click', ()=>{
      const w = el.getAttribute('data-toggle');
      const weekEl = el.closest('.week');
      const body = document.getElementById('wb-'+w);
      body.classList.toggle('open');
      weekEl.classList.toggle('open');
    });
  });
  container.querySelectorAll('.day-check').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const day = parseInt(el.getAttribute('data-day'));
      await toggleDay(day);
      render();
    });
  });
}

load();
</script>
</body>
</html>
